name: Na
options:
  bundleIdPrefix: sh.atman
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: "${DEVELOPMENT_TEAM}"  # set via env or override locally
    MARKETING_VERSION: "0.0.1"
    CURRENT_PROJECT_VERSION: "1"

packages:
  MarkdownUI:
    url: https://github.com/gonzalezreal/swift-markdown-ui
    branch: main

targets:
  Na:
    type: application
    platform: iOS
    sources:
      - Na
      # UniFFI-generated, gitignored, produced by build_crrdb_mcp.sh.
      - crrdb-mcp/crrdb_mcp.swift
    info:
      path: Na/Info.plist
      properties:
        UILaunchScreen: {}
        # Without these, xcodegen writes literal 1.0/1 instead of using
        # MARKETING_VERSION / CURRENT_PROJECT_VERSION from settings above.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        # Home-screen label.
        CFBundleDisplayName: Na
        LSApplicationCategoryType: public.app-category.productivity
        # Attach-from-camera in chat.
        NSCameraUsageDescription: "Na uses the camera to capture documents and receipts to attach to your chat."
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiredDeviceCapabilities:
          - arm64
        # Expose Documents/atman.sqlite in the Files app so the database is
        # reachable from outside the app (inspect with any SQLite tool).
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # Only standard TLS to api.anthropic.com — exempt under the default
        # U.S. mass-market crypto exemption.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: sh.atman.na
        PRODUCT_NAME: Na
        # Display-only for Xcode's Identity pane. With an explicit Info.plist
        # these settings are NOT merged into the build (verified) — the real
        # values live in the info.properties block above.
        INFOPLIST_KEY_CFBundleDisplayName: Na
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        HEADER_SEARCH_PATHS: "$(SRCROOT)/crrdb-mcp"
        LIBRARY_SEARCH_PATHS: "$(SRCROOT)/crrdb-mcp"
        # Lets `crrdb_mcp.swift` resolve `import crrdb_mcpFFI`.
        SWIFT_INCLUDE_PATHS: "$(SRCROOT)/crrdb-mcp"
        OTHER_LDFLAGS: "-lcrrdb_mcp"
