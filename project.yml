name: Na
options:
  bundleIdPrefix: sh.atman
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: "${DEVELOPMENT_TEAM}"  # set via env or override locally
    MARKETING_VERSION: "0.0.1"
    CURRENT_PROJECT_VERSION: "1"

packages:
  MarkdownUI:
    url: https://github.com/gonzalezreal/swift-markdown-ui
    branch: main

packages:
  MLXLM:
    url: https://github.com/ml-explore/mlx-swift-lm
    from: 3.31.4
  SwiftHuggingFace:
    url: https://github.com/huggingface/swift-huggingface
    from: 0.9.0
  SwiftTransformers:
    url: https://github.com/huggingface/swift-transformers
    from: 1.3.0

targets:
  Na:
    type: application
    platform: iOS
    sources:
      - Na
      # UniFFI-generated, gitignored, produced by build_crrdb_mcp.sh.
      - crrdb-mcp/crrdb_mcp.swift
    info:
      path: Na/Info.plist
      properties:
        UILaunchScreen: {}
        # Without these, xcodegen writes literal 1.0/1 instead of using
        # MARKETING_VERSION / CURRENT_PROJECT_VERSION from settings above.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Home-screen label; the product/module name stays AtmanAgent.
        CFBundleDisplayName: Na
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiredDeviceCapabilities:
          - arm64
        # Expose Documents/atman.sqlite in the Files app so the database is
        # reachable from outside the app (inspect with any SQLite tool).
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # Only standard TLS to api.anthropic.com — exempt under the default
        # U.S. mass-market crypto exemption.
        ITSAppUsesNonExemptEncryption: false
    dependencies:
      - package: MLXLM
        product: MLXLLM
      - package: MLXLM
        product: MLXLMCommon
      - package: MLXLM
        product: MLXHuggingFace
      - package: SwiftHuggingFace
        product: HuggingFace
      - package: SwiftTransformers
        product: Tokenizers
    entitlements:
      path: Na/Na.entitlements
      properties:
        # A 4-bit 4B model (~2.3 GB weights + KV cache) exceeds the default
        # per-app memory ceiling on iPhone.
        com.apple.developer.kernel.increased-memory-limit: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: sh.atman.na
        PRODUCT_NAME: Na
        HEADER_SEARCH_PATHS: "$(SRCROOT)/crrdb-mcp"
        LIBRARY_SEARCH_PATHS: "$(SRCROOT)/crrdb-mcp"
        # Lets `crrdb_mcp.swift` resolve `import crrdb_mcpFFI`.
        SWIFT_INCLUDE_PATHS: "$(SRCROOT)/crrdb-mcp"
        OTHER_LDFLAGS: "-lcrrdb_mcp"
